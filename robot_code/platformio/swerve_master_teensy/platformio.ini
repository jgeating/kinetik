; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common configuration shared between environments
[common]
monitor_speed = 460800
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    NativeEthernet
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
                ; teensy-cli | teensy-gui (teensy-gui is more reliable)

; Environment for penny_v4 robot program
[env:penny_v4]
extends = common
build_src_filter =
    +<*> 
    -<.git/>
    -<.pio/>
    -<penny_v3.cpp>
    -<telemetry_testing.cpp>
    -<**/.venv>
; Environment for testing telemetry
[env:telemetry_testing]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_src_filter =
    -<*>
    +<telemetry_testing.cpp>
    +<Telemetry.cpp>
    -<**/.venv>
