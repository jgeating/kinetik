; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common configuration shared between environments
[common]
monitor_speed = 460800
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    NativeEthernet
    mjbots/Moteus@^1.1.1
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
                ; teensy-cli | teensy-gui (teensy-gui is more reliable)

; Environment for penny_v4 MASTER Teensy (back modules + planner/RC/pads)
; Upload: pio run -e penny_v4 -t upload
[env:penny_v4]
extends = common
build_src_filter =
    +<*> 
    -<.git/>
    -<.pio/>
    -<penny_v3.cpp>
    -<penny_v4_slave.cpp>
    -<telemetry_testing.cpp>
    -<test_hardware/>
    -<**/.venv>

; Environment for penny_v4 SLAVE Teensy (front modules, serial-link forwarder)
; Upload: pio run -e penny_v4_slave -t upload
[env:penny_v4_slave]
extends = common
build_src_filter =
    -<*>
    +<penny_v4_slave.cpp>

; Hardware validation: spin all 4 Moteus N1 motors on the MASTER's CAN3 bus
; (steer 1, 2 + drive 11, 12). Bench test only - bypasses planner/RC/slave link.
; Upload: pio run -e test_spin_master -t upload
[env:test_spin_master]
extends = common
build_src_filter =
    -<*>
    +<test_hardware/spin_all_master.cpp>

; Hardware validation: spin all 4 Moteus N1 motors on the SLAVE's CAN3 bus
; (steer 0, 3 + drive 10, 13). Bench test only - drives motors locally.
; Upload: pio run -e test_spin_slave -t upload
[env:test_spin_slave]
extends = common
build_src_filter =
    -<*>
    +<test_hardware/spin_all_slave.cpp>

; Environment for testing telemetry
[env:telemetry_testing]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_src_filter =
    -<*>
    +<telemetry_testing.cpp>
    +<Telemetry.cpp>
    -<**/.venv>
